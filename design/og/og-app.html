<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=JetBrains+Mono:wght@500;700;800&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0a0d14; font-family: Montserrat, sans-serif; color: #f3f4f8; }
  .stage { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(560px 460px at 80% 50%, rgba(130, 89, 239, 0.42), transparent 70%),
      radial-gradient(480px 380px at 0% 100%, rgba(45, 132, 235, 0.16), transparent 70%),
      #0a0d14; }
  .grid { position: absolute; inset: 0; opacity: 0.5;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(800px 520px at 70% 50%, #000 30%, transparent 80%); }
  .brand { position: absolute; left: 64px; top: 54px; display: flex; align-items: center; gap: 14px; }
  .brand b { font-size: 30px; font-weight: 800; }
  .copy { position: absolute; left: 64px; top: 150px; width: 600px; }
  .h { font-size: 74px; font-weight: 900; line-height: 1.0; letter-spacing: -0.04em; }
  .h .g { color: #a98bff; }
  .sub { margin-top: 24px; font-size: 25px; font-weight: 600; color: #b4bac8; line-height: 1.4; }
  .chips { display: flex; gap: 12px; margin-top: 30px; }
  .chip { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 20px; padding: 10px 18px; border-radius: 12px;
    background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.14); }
  .chip s { text-decoration: none; color: #34eeb6; margin-right: 8px; }
  .url { position: absolute; left: 64px; bottom: 48px; font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 700; color: #9aa1b2; }
  .url i { font-style: normal; color: #34eeb6; }
  .card { position: absolute; right: 72px; top: 120px; width: 400px; padding: 34px 32px 30px; border-radius: 28px;
    background: linear-gradient(180deg, #1a2030, #121722); border: 1.5px solid rgba(169,139,255,0.45);
    box-shadow: 0 50px 120px rgba(0,0,0,0.6), 0 0 0 10px rgba(130,89,239,0.10); transform: rotate(-3deg); }
  .lbl { font-size: 15px; font-weight: 600; letter-spacing: 0.2em; color: #9aa1b2; text-align: center; }
  .amt { margin-top: 14px; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 800; font-size: 50px; letter-spacing: -0.03em; white-space: nowrap; }
  .amt em { font-style: normal; color: #34eeb6; }
  .amt small { font-family: Montserrat; font-size: 19px; font-weight: 800; color: #9aa1b2; margin-left: 6px; }
  .spark { margin-top: 18px; height: 80px; }
  .btn { margin-top: 18px; height: 62px; border-radius: 16px; background: #8259ef; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; }
  .note { margin-top: 12px; text-align: center; font-size: 15px; color: #9aa1b2; font-weight: 600; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 64 64" fill="none"><path d="M32 60V35" stroke="#F3F4F8" stroke-width="7" stroke-linecap="round"/><path d="M32 36C17 36 7.5 26.5 7.5 11.5C22.5 11.5 32 21 32 36Z" fill="#F3F4F8"/><path d="M32 36C32 17.5 42.5 5.5 58.5 5C58.5 22 48.5 36 32 36Z" fill="#8259EF"/></svg>
    <b>YieldLinks</b>
  </div>
  <div class="copy">
    <div class="h">Send a gift<br />that <span class="g">grows.</span></div>
    <div class="sub">Tokens earn yield in SaucerSwap until your friend claims them with one tap.</div>
    <div class="chips">
      <div class="chip"><s>✓</s>No wallet</div>
      <div class="chip"><s>✓</s>No HBAR</div>
      <div class="chip"><s>✓</s>No account</div>
    </div>
  </div>
  <div class="url">yield-links-hedera.vercel.app · <i>Hedera testnet</i></div>
  <div class="card">
    <div class="lbl">YOU RECEIVED A GIFT</div>
    <div class="amt">100.0000<em>090</em><small>SAUCE</small></div>
    <svg class="spark" viewBox="0 0 400 80" preserveAspectRatio="none" width="100%">
      <defs><linearGradient id="f" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#34eeb6" stop-opacity="0.35"/><stop offset="1" stop-color="#34eeb6" stop-opacity="0"/></linearGradient></defs>
      <path d="M0 72 C60 70 100 65 150 58 S240 44 290 30 S360 10 400 5 L400 80 L0 80Z" fill="url(#f)"/>
      <path d="M0 72 C60 70 100 65 150 58 S240 44 290 30 S360 10 400 5" stroke="#34eeb6" stroke-width="5" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="btn">Claim gift</div>
    <div class="note">A relayer pays the network fee</div>
  </div>
</div>
</body>
</html>
