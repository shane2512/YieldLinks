<!doctype html><html><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@700;800&display=block" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#0a0b12;--paper:#eee7d8;--cream:#f7f2e6;--violet:#7048f0;--mint:#2fe8b0;--coral:#ff5a3d}
body{width:1280px;height:720px;overflow:hidden;background:var(--ink);font-family:"JetBrains Mono",monospace}
.s{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--ink)}
.c1{position:absolute;width:760px;height:760px;border-radius:50%;background:var(--violet);right:-210px;top:-160px}
.c2{position:absolute;width:420px;height:420px;border-radius:50%;background:var(--mint);left:-170px;bottom:-190px}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(247,242,230,.13) 1.6px,transparent 2.2px);background-size:22px 22px}
.badge{position:absolute;left:56px;top:50px;padding:10px 22px;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:800;font-size:22px;letter-spacing:.14em}
.badge i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--coral);margin-right:12px}
h1{position:absolute;left:52px;top:128px;font-family:"Archivo Black",sans-serif;font-weight:400;text-transform:uppercase;font-size:116px;line-height:.95;letter-spacing:-.045em;color:var(--cream)}
h1 span{display:block;color:var(--mint)}
.sub{position:absolute;left:56px;top:430px;width:560px;font-weight:700;font-size:27px;line-height:1.35;color:var(--cream);letter-spacing:.01em}
.chips{position:absolute;left:56px;bottom:50px;display:flex;gap:14px}
.chip{padding:10px 18px;border:4px solid var(--cream);border-radius:10px;color:var(--cream);font-weight:800;font-size:20px;letter-spacing:.08em;background:var(--ink)}
.chip.m{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.card{position:absolute;left:790px;top:170px;width:420px;padding:30px 32px;background:var(--cream);border:7px solid var(--ink);border-radius:20px;box-shadow:16px 16px 0 var(--ink);transform:rotate(3deg);color:var(--ink)}
.card .l{font-weight:800;font-size:17px;letter-spacing:.2em;text-align:center}
.card .a{margin-top:14px;text-align:center;font-weight:800;font-size:40px;letter-spacing:-.03em;white-space:nowrap}
.card .a em{font-style:normal;color:var(--violet)}
.card .a small{font-size:20px;margin-left:6px}
.card .g{margin-top:16px;height:90px;width:100%}
.card .b{margin-top:14px;height:62px;background:var(--ink);color:var(--mint);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;letter-spacing:.1em}
.mark{position:absolute;right:56px;bottom:46px}
</style></head><body><div class="s">
<div class="dots"></div><div class="c1"></div><div class="c2"></div>
<div class="badge"><i></i>FULL DEMO · HEDERA TESTNET</div>
<h1>Gifts that<span>grow.</span></h1>
<div class="sub">Send crypto as a link. It stakes at once. They claim with no wallet.</div>
<div class="chips"><div class="chip m">SCAFFOLD-HBAR</div><div class="chip">EIP-712</div><div class="chip">HIP-904</div></div>
<div class="card"><div class="l">YOU RECEIVED A GIFT</div><div class="a"><em>100.0000900</em><small>SAUCE</small></div>
<svg class="g" viewBox="0 0 360 90"><path d="M0 76 C60 74 90 70 130 58 S210 34 250 26 S320 10 350 8" stroke="#7048f0" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="350" cy="8" r="9" fill="#2fe8b0" stroke="#0a0b12" stroke-width="4"/></svg>
<div class="b">CLAIM GIFT</div></div>
<svg class="mark" width="120" height="120" viewBox="0 0 64 64" fill="none"><path d="M32 60V35" stroke="#f7f2e6" stroke-width="7" stroke-linecap="round"/><path d="M32 36C17 36 7.5 26.5 7.5 11.5C22.5 11.5 32 21 32 36Z" fill="#f7f2e6"/><path d="M32 36C32 17.5 42.5 5.5 58.5 5C58.5 22 48.5 36 32 36Z" fill="#2fe8b0"/></svg>
</div></body></html>
